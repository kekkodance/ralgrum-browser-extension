name: Release to AMO

# Manual release: Actions -> Release to AMO -> Run workflow, then enter the
# new version number (e.g. 0.2.0). The workflow writes it into the manifests
# and package files, submits for listed review, and commits the bump back.
# Needs AMO_API_KEY / AMO_API_SECRET repo secrets (AMO account -> API keys).
# Mozilla signs the add-on after approval, nothing is published instantly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version to release, e.g. 0.2.0"
        required: true
      notes:
        description: "Release notes shown on the AMO listing (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: amo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version from input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "
            if (!/^\d+\.\d+\.\d+$/.test(process.env.RELEASE_VERSION)) {
              throw new Error('Version must look like 0.2.0, got: ' + process.env.RELEASE_VERSION);
            }
          "
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('node:fs');
            const version = process.env.RELEASE_VERSION;
            for (const file of ['extension/manifest.json', 'extension/manifest.firefox.json']) {
              const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
              manifest.version = version;
              fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
            }
          "
          # JSON.stringify expands arrays Prettier keeps on one line, so renormalize.
          npx prettier --write extension/manifest.json extension/manifest.firefox.json package.json package-lock.json
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Pack dist/firefox with forward-slash paths for AMO
        run: |
          rm -f dist/firefox.zip
          python3 -c "import zipfile; from pathlib import Path; src = Path('dist/firefox'); out = Path('dist/firefox.zip'); files = sorted(p for p in src.rglob('*') if p.is_file()); archive = zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED); [archive.write(p, p.relative_to(src).as_posix()) for p in files]; archive.close(); print('packed', len(files), 'files')"
      - name: Submit to AMO for listed review
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          ARGS=(--zip dist/firefox.zip --version "$RELEASE_VERSION" --slug ralgrum-browser-extension)
          if [ -n "$RELEASE_NOTES" ]; then ARGS+=(--notes "$RELEASE_NOTES"); fi
          node scripts/amo-submit.mjs "${ARGS[@]}"
      - name: Commit version bump back
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json extension/manifest.firefox.json package.json package-lock.json
          git diff --cached --quiet && echo "versions already set, nothing to commit" || (git commit -m "Bump version to $RELEASE_VERSION" && git push origin HEAD)
