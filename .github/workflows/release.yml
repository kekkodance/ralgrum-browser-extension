name: Release to AMO

# Manual release: Actions -> Release to AMO -> Run workflow, then enter the
# version number. That version must already be set in extension/manifest.json,
# extension/manifest.firefox.json, and package.json on master (CI checks this),
# so bump it in a normal commit first. Needs AMO_API_KEY / AMO_API_SECRET repo
# secrets (AMO account -> API keys). Submits for listed review; Mozilla signs
# the add-on after approval, nothing is published instantly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (must match the manifests)"
        required: true
      notes:
        description: "Release notes shown on the AMO listing (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check requested version matches the manifests
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const fs = require('node:fs');
            const wanted = process.env.RELEASE_VERSION;
            if (!/^\d+\.\d+\.\d+$/.test(wanted)) {
              throw new Error('Version must look like 0.2.0, got: ' + wanted);
            }
            for (const file of ['extension/manifest.json', 'extension/manifest.firefox.json', 'package.json']) {
              const actual = JSON.parse(fs.readFileSync(file, 'utf8')).version;
              if (actual !== wanted) {
                throw new Error(file + ' is version ' + actual + ', not ' + wanted + '. Bump it in a commit first.');
              }
            }
            console.log('releasing version ' + wanted);
          "
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Pack dist/firefox with forward-slash paths for AMO
        run: |
          rm -f dist/firefox.zip
          python3 -c "import zipfile; from pathlib import Path; src = Path('dist/firefox'); out = Path('dist/firefox.zip'); files = sorted(p for p in src.rglob('*') if p.is_file()); archive = zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED); [archive.write(p, p.relative_to(src).as_posix()) for p in files]; archive.close(); print('packed', len(files), 'files')"
      - name: Submit to AMO for listed review
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          ARGS=(--zip dist/firefox.zip --version "$RELEASE_VERSION" --slug ralgrum-browser-extension)
          if [ -n "$RELEASE_NOTES" ]; then ARGS+=(--notes "$RELEASE_NOTES"); fi
          node scripts/amo-submit.mjs "${ARGS[@]}"
