name: Update userscript bundle

on:
  push:
    branches:
      - "**"

concurrency:
  group: update-userscript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build browser extension and userscript
        run: npm run build
      - name: Commit updated userscript bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userscript/ralgrum.user.js
          if git diff --cached --quiet; then
            echo "Userscript bundle is current."
            exit 0
          fi
          git commit -m "chore: refresh userscript bundle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
