<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ralgruM options</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; background: #09090b; color: #fafafa; font-family: "Segoe UI", system-ui, sans-serif; }
.wrap { max-width: 560px; padding: 20px; }
h1 { font-size: 16px; }
p { color: #a1a1aa; font-size: 13px; }
label { display: flex; gap: 8px; align-items: center; padding: 7px 0; font-size: 13.5px; }
.card { background: #121215; border: 1px solid #27272a; border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
button { height: 32px; border-radius: 8px; border: 1px solid #6366f1; background: #6366f1; color: #fff; font-weight: 700; padding: 0 14px; cursor: pointer; }
.test { margin-top: 10px; font-size: 12.5px; word-break: break-all; }
.test a { color: #818cf8; }
#status { font-size: 12.5px; color: #10b981; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
<h1>ralgruM Browser Integration</h1>
<p>Choose when the top right toast appears and test the ralgrum:// bridge.</p>
<div class="card">
<label><input type="checkbox" id="autoShow" /> Show toast automatically on supported pages</label>
<label><input type="checkbox" id="showOnTrack" /> Show on tracks</label>
<label><input type="checkbox" id="showOnCollection" /> Show on albums and playlists</label>
<label><input type="checkbox" id="showOnArtist" /> Show on artists</label>
<label><input type="checkbox" id="deezer" /> Enable on Deezer</label>
<label><input type="checkbox" id="soundcloud" /> Enable on SoundCloud</label>
</div>
<button id="save">Save</button>
<p id="status"></p>
<div class="card">
<strong>Protocol test</strong>
<p>If ralgruM is registered, clicking a test link opens the app.</p>
<div class="test"><a href="ralgrum://open?provider=deezer&type=track&id=3135556&action=play&url=https%3A%2F%2Fwww.deezer.com%2Ftrack%2F3135556">Deezer track test</a></div>
<div class="test"><a href="ralgrum://open?provider=soundcloud&type=track&action=play&url=https%3A%2F%2Fsoundcloud.com%2Ftest%2Fdemo">SoundCloud track test</a></div>
</div>
</div>
<script src="options.js"></script>
</body>
</html>
